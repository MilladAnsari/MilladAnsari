<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title description">
  <title id="title">Animated smart home</title>
  <desc id="description">A connected home with animated lights, Wi-Fi, and data flow.</desc>

  <defs>
    <linearGradient id="roof" x1="0" x2="1">
      <stop stop-color="#0e6e55"/>
      <stop offset="1" stop-color="#a16f0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="data-path" d="M636 177 C651 165 641 142 669 132" fill="none"/>
  </defs>

  <g fill="none" stroke="#30363d" stroke-width="1">
    <path d="M65 218H835"/>
    <path d="M85 230H815" opacity=".45"/>
  </g>

  <!-- House -->
  <path d="M245 128 380 35 515 128" fill="none" stroke="url(#roof)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
  <path d="M275 113V218H485V113" fill="#0e6e55" fill-opacity=".08" stroke="#0e6e55" stroke-linejoin="round" stroke-width="5"/>
  <path d="M280 183H480M380 113V183" stroke="#0e6e55" stroke-opacity=".35" stroke-width="2"/>
  <path d="M355 218V154H405V218" fill="#0e6e55" fill-opacity=".16" stroke="#0e6e55" stroke-width="4"/>
  <circle cx="396" cy="186" r="3" fill="#0e6e55"/>

  <!-- Smart windows -->
  <g stroke="#0e6e55" stroke-width="4">
    <rect x="300" y="142" width="30" height="34" rx="3" fill="#a16f0b" filter="url(#glow)">
      <animate attributeName="fill" values="#a16f0b;#ffe08a;#a16f0b" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="430" y="142" width="30" height="34" rx="3" fill="#ffe08a" filter="url(#glow)">
      <animate attributeName="fill" values="#ffe08a;#a16f0b;#ffe08a" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Motorized curtain on the right window -->
  <g transform="translate(428 137)">
    <path d="M-3 2h37" stroke="#0e6e55" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="4" width="13" height="34" rx="2" fill="#0e6e55" fill-opacity=".48">
      <animate attributeName="width" values="13;4;13" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="17" y="4" width="13" height="34" rx="2" fill="#0e6e55" fill-opacity=".48">
      <animate attributeName="x" values="17;26;17" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="13;4;13" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="34" cy="1" r="3" fill="#a16f0b"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Thermostat -->
  <g transform="translate(293 188)">
    <rect width="28" height="20" rx="4" fill="#ffffff" fill-opacity=".08" stroke="#0e6e55" stroke-width="2"/>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">22°</text>
  </g>

  <!-- Additional indoor and porch lights -->
  <g stroke="#0e6e55" stroke-linecap="round" stroke-width="2">
    <path d="M329 114v15M323 129h12"/>
    <path d="M419 114v15M413 129h12"/>
    <path d="M491 155h18"/>
  </g>
  <g fill="#ffe08a" filter="url(#glow)">
    <circle cx="329" cy="132" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="419" cy="132" r="5"><animate attributeName="opacity" values="1;.35;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="511" cy="155" r="5"><animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- CAN-controlled ceiling fan -->
  <g transform="translate(374 132)" stroke="#0e6e55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-17V-7" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      <path d="M0 0C-5-19-19-16-16-7-13 1-5 3 0 0ZM0 0C19-5 16-19 7-16-1-13-3-5 0 0ZM0 0C5 19 19 16 16 7 13-1 5-3 0 0ZM0 0C-19 5-16 19-7 16 1 13 3 5 0 0Z" fill="#0e6e55" fill-opacity=".24" stroke-width="2"/>
    </g>
    <circle r="4" fill="#a16f0b" stroke="none"/>
  </g>

  <!-- Animated thermostat reading (20–25 °C) -->
  <g transform="translate(293 188)">
    <rect x="2" y="2" width="24" height="16" rx="3" fill="#0b1715"/>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">20&#176;<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.15;.17;.98;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">23&#176;<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.15;.17;.32;.34;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">21&#176;<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.34;.49;.51;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">25&#176;<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.51;.66;.68;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">22&#176;<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.66;.68;.83;.85;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="14" y="14" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0">24&#176;<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.83;.85;.98;1" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- Security camera -->
  <g transform="translate(487 119)" stroke="#0e6e55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 4h16l7 6-7 6H0Z" fill="#0e6e55" fill-opacity=".15" stroke-width="2"/>
    <circle cx="14" cy="10" r="3" fill="#a16f0b"><animate attributeName="fill" values="#a16f0b;#ffdf79;#a16f0b" dur="1.4s" repeatCount="indefinite"/></circle>
    <path d="M5 16v8" stroke-width="2"/>
  </g>

  <!-- Cloud endpoint -->
  <g transform="translate(650 82)" fill="#0e6e55" fill-opacity=".1" stroke="#0e6e55" stroke-width="4">
    <path d="M23 70h105a25 25 0 0 0 1-50 38 38 0 0 0-70-4A27 27 0 0 0 23 70Z"/>
  </g>
  <text x="725" y="126" fill="#0e6e55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">THINGSBOARD SERVER</text>
  <g transform="translate(684 139)" fill="none" stroke="#a16f0b" stroke-width="2">
    <ellipse cx="17" cy="4" rx="17" ry="4"/>
    <path d="M0 4v15c0 5 34 5 34 0V4M0 12c0 5 34 5 34 0"/>
  </g>

  <!-- Wi-Fi telemetry: ESP32-S3 to ThingsBoard -->
  <g fill="none" stroke="#1d4ed8" stroke-linecap="round" stroke-width="3">
    <path d="M594 157a24 24 0 0 1 32 0" opacity=".35"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></path>
    <path d="M601 164a14 14 0 0 1 18 0" opacity=".7"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".2s" repeatCount="indefinite"/></path>
  </g>
  <text x="642" y="158" fill="#1d4ed8" font-family="ui-monospace, monospace" font-size="10">WI-FI</text>
  <use href="#data-path" stroke="#1d4ed8" stroke-dasharray="6 10" stroke-linecap="round" stroke-width="3" opacity=".75"/>
  <circle r="6" fill="#1d4ed8" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" rotate="auto"><mpath href="#data-path"/></animateMotion>
  </circle>
  <circle r="4" fill="#1d4ed8">
    <animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite" rotate="auto"><mpath href="#data-path"/></animateMotion>
  </circle>

  <!-- Resident controlling the home from a phone -->
  <g transform="translate(125 146)" stroke="#0e6e55" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="10" r="8" fill="#0e6e55" fill-opacity=".16" stroke-width="3"/>
    <path d="M16 19v29M16 26l-13 13M16 27l15 8M16 48l-10 18M16 48l12 18" fill="none" stroke-width="4"/>
    <rect x="29" y="25" width="10" height="17" rx="2" fill="#0e6e55" fill-opacity=".18" stroke-width="2"/>
    <circle cx="34" cy="38" r="1.4" fill="#a16f0b" stroke="none"/>
    <path d="M43 26q10 6 0 12M47 22q17 10 0 20" fill="none" stroke="#a16f0b" stroke-width="2">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="140" y="235" fill="#0e6e55" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">MOBILE CONTROL</text>
  <!-- Phone communicates only with ThingsBoard -->
  <path d="M164 175C150 100 190 25 300 18C430 -4 575 12 695 88" fill="none" stroke="#22c55e" stroke-dasharray="4 7" stroke-linecap="round" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <rect x="448" y="2" width="74" height="15" rx="3" fill="#0b1715" opacity=".94"/>
  <text x="485" y="13" fill="#22c55e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">5G CELLULAR</text>

  <!-- Bluetooth: ESP32-S3 to garden lamp -->
  <path d="M558 201C465 241 300 241 229 198" fill="none" stroke="#38bdf8" stroke-dasharray="4 7" stroke-linecap="round" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="326" y="224" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">BLUETOOTH</text>

  <!-- ESP32-S3 touch display / local edge controller -->
  <g transform="translate(558 161)">
    <rect width="78" height="48" rx="6" fill="#0e6e55" fill-opacity=".12" stroke="#0e6e55" stroke-width="3"/>
    <rect x="7" y="7" width="64" height="28" rx="3" fill="#071b18" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M12 16h22M12 22h14M48 14h15M48 21h15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="15" r="3" fill="#a16f0b"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="39" cy="42" r="2" fill="#a16f0b"/>
  </g>
  <text x="597" y="222" fill="#0e6e55" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">ESP32-S3 TOUCH</text>

  <!-- CAN bus: thermostat and light controlled by the local panel -->
  <g fill="none" stroke="#a16f0b" stroke-linecap="round">
    <path d="M319 199C395 224 485 223 558 189" stroke-dasharray="7 6" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M329 138C412 174 480 203 558 185" stroke-dasharray="7 6" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="0;26" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M374 132C440 157 502 195 558 182" stroke-dasharray="7 6" stroke-width="2.5">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#a16f0b" filter="url(#glow)">
    <circle cx="390" cy="217" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="461" cy="188" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="454" y="207" fill="#a16f0b" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">CAN BUS</text>

  <!-- Yellow control links: ESP32-S3 to curtain and its ceiling light -->
  <g fill="none" stroke="#f0b429" stroke-dasharray="4 5" stroke-linecap="round" stroke-width="2">
    <path d="M558 188C522 172 488 154 445 151"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M558 184C520 157 475 136 419 132"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.3s" repeatCount="indefinite"/></path>
  </g>

  <!-- Garden, smart lamp, and EV charger -->
  <g transform="translate(205 184)">
    <path d="M24 34V8" stroke="#0e6e55" stroke-width="3"/>
    <path d="M16 9q8-12 16 0" fill="#a16f0b" filter="url(#glow)">
      <animate attributeName="fill" values="#a16f0b;#ffe08a;#a16f0b" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 34h48" stroke="#0e6e55" stroke-width="2"/>
  </g>
  <g transform="translate(530 186)">
    <rect x="0" y="2" width="22" height="31" rx="3" fill="#0e6e55" fill-opacity=".1" stroke="#0e6e55" stroke-width="2"/>
    <path d="M11 8 6 19h5l-1 7 7-11h-5Z" fill="#a16f0b"><animate attributeName="opacity" values=".45;1;.45" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M22 10q15 0 15 12v6" fill="none" stroke="#0e6e55" stroke-width="2"/>
  </g>

  <!-- Ground devices -->
  <g fill="#0e6e55">
    <circle cx="195" cy="218" r="7"><animate attributeName="fill" values="#0e6e55;#a16f0b;#0e6e55" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="218" r="7"><animate attributeName="fill" values="#a16f0b;#0e6e55;#a16f0b" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M195 211V186M540 211V186" stroke="#0e6e55" stroke-dasharray="3 5" stroke-width="2"/>
  <text x="205" y="245" fill="#0e6e55" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">GARDEN'S LAMP</text>
  <text x="380" y="245" fill="#0e6e55" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CONNECTED HOME</text>
  <text x="551" y="245" fill="#0e6e55" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">EV CHARGE</text>
</svg>
