<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 960 408" role="img" aria-labelledby="home-title">
  <title id="home-title">Smart home: person with phone, cloud, controller, and a house with a fan, lights, windows, blind, lamp and door</title>
  <style>
    :root {
      --ink: #0e6e55;
      --amber: #c98a12;
      --blue: #2f6fed;
      --sky: #0e98d4;
      --green: #1f9d55;
      --bulb: #f2b72b;
      --curt: #a4cabc;
      --bg-card: #ffffff;
      --line-color: #d5ddd9;
      --fg-color: #13201c;
      --muted-color: #5b6b66;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #2fb58f;
        --amber: #e8b04a;
        --blue: #7aa2ff;
        --sky: #4cc3f5;
        --green: #4ade80;
        --bulb: #ffd866;
        --curt: #326e60;
        --bg-card: #161b22;
        --line-color: #30363d;
        --fg-color: #e6edf3;
        --muted-color: #8b9a95;
      }
    }
    .sI, .sA, .sB, .sS, .sG, .sL { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sI { stroke: var(--ink); }
    .sA { stroke: var(--amber); }
    .sB { stroke: var(--blue); }
    .sS { stroke: var(--sky); }
    .sG { stroke: var(--green); }
    .sL { stroke: var(--line-color); stroke-width: 2; }
    .fI { fill: var(--ink); }
    .fA { fill: var(--amber); }
    .fB { fill: var(--blue); }
    .fG { fill: var(--green); }
    .fL { fill: var(--bulb); }
    .soft { fill: var(--ink); fill-opacity: 0.07; }
    .soft2 { fill: var(--sky); fill-opacity: 0.1; }
    .glass { fill: var(--bulb); fill-opacity: 0.2; }
    .curt { fill: url(#curtain-pattern); stroke: var(--ink); stroke-width: 1; stroke-opacity: 0.45; }
    .panel { fill: var(--bg-card); }
    .tx { fill: var(--fg-color); font: 600 13px system-ui, -apple-system, sans-serif; }
    .tm { fill: var(--muted-color); font-family: system-ui, -apple-system, sans-serif; }
    .mono { font: 700 12px ui-monospace, Menlo, Consolas, monospace; }
    .shade { fill: var(--bg-card); }
    .halo { opacity: 0.8; }
  </style>

  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="lampg">
      <stop offset="0" style="stop-color:var(--bulb)" stop-opacity=".75"/>
      <stop offset="1" style="stop-color:var(--bulb)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="curtain-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="var(--curt)"/>
      <path d="M1 0V8M5 0V8" stroke="var(--ink)" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <clipPath id="winB-clip"><rect x="307" y="212" width="66" height="68"/></clipPath>
    <path id="wifi-path" d="M780 276V140"/>
    <path id="cell-path" d="M135 248V28H790V58"/>
  </defs>

  <path d="M40 340H920" class="sL"/>

  <!-- Cloud -->
  <g transform="translate(703 62)"><path d="M23 70h105a25 25 0 0 0 1-50 38 38 0 0 0-70-4A27 27 0 0 0 23 70Z" class="sI soft" stroke-width="3"/></g>
  <text x="780" y="106" text-anchor="middle" class="tx">ThingsBoard</text>

  <!-- Animated Data Flows -->
  <use href="#cell-path" class="sG" stroke-width="2.5" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.6s" repeatCount="indefinite"/></use>
  <use href="#wifi-path" class="sB" stroke-width="2.5" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="0;24" dur="1.6s" repeatCount="indefinite"/></use>
  <circle r="4.5" class="fB" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#wifi-path"/></animateMotion></circle>
  <circle r="4.5" class="fG" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#cell-path"/></animateMotion></circle>
  <path d="M840 308H884" class="sS" stroke-width="2.5" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="0;24" dur="1.6s" repeatCount="indefinite"/></path>
  <path d="M720 308H606V164H262M520 164V209M340 164V209M290 164V292H340V281" class="sA" stroke-width="3" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.6s" repeatCount="indefinite"/></path>

  <g><rect x="402" y="18" width="56" height="20" rx="10" class="panel"/><text x="430" y="32" text-anchor="middle" class="mono fG">5G</text></g>
  <g><circle cx="780" cy="208" r="16" class="panel"/><path d="M770 205a14 14 0 0 1 20 0M774 211a8 8 0 0 1 12 0" class="sB" stroke-width="2.5"/><circle cx="780" cy="217" r="2" class="fB"/></g>
  <g><rect x="651" y="298" width="42" height="20" rx="10" class="panel"/><text x="672" y="312" text-anchor="middle" class="mono fA">CAN</text></g>

  <!-- House -->
  <path d="M206 154 430 52 654 154" class="sI" stroke-width="8"/>
  <rect x="230" y="150" width="400" height="190" class="sI soft" stroke-width="4"/>

  <!-- Lights -->
  <path d="M262 164v14M580 164v14" class="sI" stroke-width="2.5"/>
  <circle cx="262" cy="188" r="8" class="fL" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="188" r="8" class="fL" filter="url(#glow)"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- Fan Rotation -->
  <path d="M430 164V198" class="sI" stroke-width="3"/>
  <g transform="translate(430 202) scale(1.5)">
    <g id="fan-rotor">
      <path d="M0 0C-5-19-19-16-16-7-13 1-5 3 0 0ZM0 0C19-5 16-19 7-16-1-13-3-5 0 0ZM0 0C5 19 19 16 16 7 13-1 5-3 0 0ZM0 0C-19 5-16 19-7 16 1 13 3 5 0 0Z" class="sI soft" stroke-width="1.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle r="3.5" class="fA"/>
  </g>

  <!-- Door -->
  <rect x="403" y="248" width="54" height="92" rx="3" class="sI soft" stroke-width="3.5"/>
  <rect x="412" y="257" width="36" height="30" rx="2" class="sI" stroke-width="1.5"/>
  <rect x="412" y="295" width="36" height="37" rx="2" class="sI" stroke-width="1.5"/>
  <circle cx="448" cy="301" r="3" class="fA"/>

  <!-- Windows -->
  <rect x="305" y="210" width="70" height="72" rx="3" class="sI glass" stroke-width="3"/>
  <g id="lamp" clip-path="url(#winB-clip)">
    <circle cx="340" cy="254" r="40" fill="url(#lampg)" class="halo"/>
    <ellipse cx="340" cy="277" rx="11" ry="3" class="fI"/>
    <path d="M340 275V262" class="sI" stroke-width="3"/>
    <path d="M327 262 333 238H347L353 262Z" class="sI fL" stroke-width="2.5"/>
    <animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <rect id="cur-l" x="307" y="212" width="33" height="68" class="fI curt">
    <animate attributeName="width" values="33;10;33" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect id="cur-r" x="340" y="212" width="33" height="68" class="fI curt">
    <animate attributeName="x" values="340;363;340" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="33;10;33" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M301 210h78" class="sI" stroke-width="3"/>
  <path d="M300 284h80" class="sI" stroke-width="4"/>

  <rect x="485" y="210" width="70" height="72" rx="3" class="sI glass" stroke-width="3"/>
  <rect x="487" y="212" width="33" height="68" class="fI curt">
    <animate attributeName="width" values="33;10;33" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="520" y="212" width="33" height="68" class="fI curt">
    <animate attributeName="x" values="520;543;520" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="33;10;33" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M481 210h78" class="sI" stroke-width="3"/>
  <path d="M480 284h80" class="sI" stroke-width="4"/>

  <!-- Thermostat -->
  <rect x="588" y="236" width="36" height="26" rx="7" class="panel sI" stroke-width="2.5"/>
  <text x="606" y="254" text-anchor="middle" class="mono fA" style="font-size:11px" opacity="1">21°<animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;.25;.5;.75" values="1;0;0;0"/></text>
  <text x="606" y="254" text-anchor="middle" class="mono fA" style="font-size:11px" opacity="0">22°<animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;.25;.5;.75" values="0;1;0;0"/></text>
  <text x="606" y="254" text-anchor="middle" class="mono fA" style="font-size:11px" opacity="0">23°<animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;.25;.5;.75" values="0;0;1;0"/></text>
  <text x="606" y="254" text-anchor="middle" class="mono fA" style="font-size:11px" opacity="0">22°<animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;.25;.5;.75" values="0;0;0;1"/></text>

  <!-- Camera -->
  <g transform="translate(640 172)">
    <path d="M-10 11h10" class="sI" stroke-width="2.5"/>
    <path d="M0 4h16l7 7-7 7H0Z" class="sI soft" stroke-width="2"/>
    <circle cx="9" cy="11" r="2.6" class="fA"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="430" y="362" text-anchor="middle" class="tx">Connected home</text>

  <!-- Mobile App Person -->
  <g class="sI" stroke-width="4">
    <circle cx="100" cy="252" r="12" class="soft" stroke-width="3"/>
    <path d="M100 266V310M100 310 90 340M100 310 112 340M100 276 86 304M100 276 120 290 132 276"/>
  </g>
  <rect x="128" y="248" width="14" height="26" rx="3" class="panel sI" stroke-width="2.5"/>
  <rect x="131" y="252" width="8" height="16" rx="1.5" class="sS soft2" stroke-width="1"/>
  <path d="M148 254q7 6 0 12M154 249q12 11 0 22" class="sG" stroke-width="2.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="110" y="362" text-anchor="middle" class="tx">Mobile app</text>

  <!-- Controller -->
  <g>
    <rect x="720" y="276" width="120" height="64" rx="12" class="panel sI" stroke-width="3"/>
    <rect x="730" y="286" width="100" height="34" rx="6" class="sS soft2" stroke-width="1.5"/>
    <path d="M740 298h28M740 308h18" class="sS" stroke-width="2.5"/>
    <circle cx="814" cy="298" r="4" class="fA"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="330" r="2.5" class="fI"/>
  </g>
  <text x="768" y="362" text-anchor="middle" class="tx">ESP32-S3 controller</text>

  <!-- Garden Lamp -->
  <path d="M900 340v-34M886 340h28" class="sI" stroke-width="3"/>
  <path d="M887 306q13-20 26 0Z" class="fL" filter="url(#glow)"><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></path>
  <text x="910" y="362" text-anchor="middle" class="tx">Garden lamp</text>

  <!-- Legend -->
  <g class="tm" style="font-size:12px">
    <path d="M227 392h26" class="sA" stroke-width="3" stroke-dasharray="6 5"/><text x="261" y="396">CAN bus</text>
    <path d="M377 392h26" class="sB" stroke-width="3" stroke-dasharray="6 5"/><text x="411" y="396">Wi-Fi</text>
    <path d="M487 392h26" class="sS" stroke-width="3" stroke-dasharray="6 5"/><text x="521" y="396">Bluetooth</text>
    <path d="M625 392h26" class="sG" stroke-width="3" stroke-dasharray="6 5"/><text x="659" y="396">5G cellular</text>
  </g>
</svg>
